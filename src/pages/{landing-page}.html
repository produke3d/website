<html>

    <head>

        <title>proDuke</title>

        <link rel="shortcut icon" href="{$common}/res/favicon.png" type="image/x-icon"> 
        <link rel="alternate" hreflang="en" href="{$domain}/en/">
        <link rel="alternate" hreflang="pt" href="{$domain}/pt/">
        
        <meta name="description" content="proDuke is a Duke Nukem 3D port based on xDuke 19.7.1. You can play with proDuke on NukemNet.">
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">    
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>

            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 16px;
                background-color: #050505;
            }

            img#symbol {
                image-rendering: pixelated;
                height: 64px;
            }

            img#logo {
                image-rendering: pixelated;
                height: 24px;
            }

            hr {
                width: 256px;
                border-color: gray;
                border-width: 1px 0 0 0;
                margin: 0px;
            }

            a {
                font-family: "Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Backtick Fix", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
                width: 256px;
                background-color: #bba247;
                text-decoration: none;
                color: black;
                text-align: center;
                line-height: 42px;
                border-radius: 8px;
                height: 42px;
                font-weight: bold;
                cursor: pointer;
                border: none;
                padding-left: 12px;
                padding-right: 12px;
                &:hover {
                    background-color: lightgrey;
                    color: black;
                }
            }

        </style>

    </head>

    <body>
        <img id="symbol" src="{$common}/res/symbol.gif" alt="produke"> 
        <img id="logo" src="{$common}/res/logo.png" alt="produke">
        <hr>
        <a href="{domain}/en">ENGLISH</a>
        <a href="{domain}/pt">PORTUGUÊS</a>
    </body>

</html>
