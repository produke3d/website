<html>

    <head>

        <title>proDuke</title>
        <meta name="description" content="proDuke is a Duke Nukem 3D port based on xDuke 19.7.1. You can play with proDuke on NukemNet.">

        <link rel="alternate" hreflang="en" href="https://produke.com.br/en/">
        <link rel="alternate" hreflang="pt" href="https://produke.com.br/pt/">
        
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">    

        <link rel="shortcut icon" href="{$common}/res/favicon.png" type="image/x-icon">        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="{$common}/src/styles/colors.css">
        <link rel="stylesheet" href="{$common}/src/styles/flex.css">
        <link rel="stylesheet" href="{$common}/src/styles/style.css">
        <link rel="stylesheet" href="{$common}/src/styles/index.css">
        <link rel="stylesheet" href="{$common}/src/styles/header.css">

        <style>

            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }

        </style>

    </head>

    <body>

        <div class="flex-rows flex-gap-16 flex-justify-content-center flex-align-items-center flex-align-self-center padding-16">
            
            <div class="flex-justify-content-center">
                <img id="icon" src="{$common}/res/icon.gif" alt="produke icon">                
            </div>

            <div class="flex-justify-content-center">
                <img id="logo" src="{$common}/res/logo.png" alt="produke logo">
            </div>

            <hr style="width: 256px;">

            <a href="{domain}/en" class="link-button" style="width: 256px;">ENGLISH</a>
            <a href="{domain}/pt" class="link-button" style="width: 256px;">PORTUGUÊS</a>

        </div>

    </body>

</html>
