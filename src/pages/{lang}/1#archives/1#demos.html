<title lang="en">Demos</title>
<title lang="pt">Demos</title>

<div id="demos"></div>

<style>
    div#demos {
        display: flex;
        flex-direction: column;
        gap: 16px;
        div.demo {
            display: flex;
            flex-direction: row;
            gap: 8px;
            background-color: #1E1E1E;
            border-radius: 10px;
            border: 1px solid #2C2C2C;
            padding: 16px;
            box-shadow: 2px 2px 2px black;
            div.field {
                display: flex;
                flex-direction: row;
                gap: 8px;
                span:first-of-type {
                    font-weight: bold;
                    text-align: right;
                }
            }
            @media (pointer: coarse) and (hover: none) {
                flex-direction: column;
            }
        }
    }
</style>

<script>

    document.addEventListener("DOMContentLoaded", async () => {

        const demosDatabaseUrl = "https://raw.githubusercontent.com/produke3d/website/master/res/databases/demos.json.gz";

        const gzipBytes = await (await fetch(demosDatabaseUrl)).arrayBuffer();
        const stream = new Blob([gzipBytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const demoDatabase = JSON.parse(await new Response(stream).text());

        const demoHtmls = [];
        
        const isTeamMode = mode => [2,3,4,5,8].includes(mode);

        const GameMode = {
            DM: 0,
            COOP: 1,
            TDM: 2,
            CTF: 3,
            ONEFCTF: 4,
            ADCTF: 5,
            SURV: 6,
            LMS: 7,
            TLMS: 8,
            TERM: 9
        };

        const gameModeDictionary = Object.keys(GameMode).reduce((dic, key) => {
            dic[GameMode[key]] = key;
            if (key === "ONEFCTF") dic[GameMode[key]] = "1FCTF";
            return dic;
        }, []);

        const getMap = demo => {
            if (demo.Volume === 0 && demo.Level === 7) {
                return demo.Map.toUpperCase().replace(".MAP", "");
            } else {
                return `E${demo.Volume+1}L${demo.Level+1}`;
            }
        };

        const getPlayers = demo => {

            const getPlayer = p => {
                let attr = "";
                if (isTeamMode(demo.Mode)) {
                    attr = `data-team="${p.Team}"`;
                } else {
                    attr = `data-color="${p.Id}"`;
                }
                return `
                    <div class="flex-row flex-no-wrap flex-justify-content-center flex-gap-4" ${attr}>
                        <span>${p.Name}</span>
                        <span>[${p.Score}]</span>
                    </div>
                `;    
                // return `
                //     <div class="flex-row flex-no-wrap flex-justify-content-center flex-gap-4" ${attr}>
                //         <span>WWWWWWWWWWWW</span>
                //         <span>[999]</span>
                //     </div>
                // `;            
            };

            let players = [];

            if (isTeamMode(demo.Mode)) {
                players = demo.Players.sort((a,b) => a.Team - b.Team).map(p => getPlayer(p));
            } else {
                players = demo.Players.sort((a,b) => a.Id - b.Id).map(p => getPlayer(p));
            }

            return `
                <div class="grid grid-4-columns">${players.join("")}</div>
            `;

        };

        const getWinner = demo => {

            const winners = demo.Players.filter(p => p.Winner);

            if (winners.length === 0) return "---";

            if (isTeamMode(demo.Mode)) {

                const winnerTeams = new Set(winners.map(p => p.Team));
                if (winnerTeams.size > 1) {
                    return "DRAW";
                } else {
                    const score = winners.reduce((total, winner) => total += winner.Score, 0);
                    switch (winnerTeams.values().next().value) {
                        case 1: return `<span data-team="1">BLUE [${score}]</span>`;
                        case 2: return `<span data-team="2">RED [${score}]</span>`;
                        case 3: return `<span data-team="3">GREEN [${score}]</span>`;
                        case 4: return `<span data-team="4">BROWN [${score}]</span>`;
                    }
                }

            } else {
                if (winners.length > 1) {
                    return "DRAW";
                } else if (winners.length === 1) {
                    return `<span data-color="${winners[0].Id}">${winners[0].Name} [${winners[0].Score}]</span>`;
                } else {
                    return "";
                }
            }

        };

        for (const demo of demoDatabase.sort((a,b) => new Date(b.StartDateTime) - new Date(a.StartDateTime))) {
            demoHtmls.push(`
                <div class="demo">
                    <div class="field">                            
                        <span lang="en">DATE</span>
                        <span lang="pt">DATA</span>
                        <span>${demo.StartDateTime}</span>    
                    </div>
                    <div class="field">                            
                        <span lang="en">MODE</span>
                        <span lang="pt">MODO</span>
                        <span>${gameModeDictionary[demo.Mode]}</span>
                    </div>
                    <div class="field">                            
                        <span lang="en">DURATION</span>
                        <span lang="pt">DURAÇÃO</span>
                        <span>${demo.Duration}</span>
                    </div>
                    <div class="field">                            
                        <span lang="en">WINNER</span>
                        <span lang="pt">VENCEDOR</span>
                        ${getWinner(demo)}
                    </div>
                </div>
            `);
        }

        /*<td style="white-space: nowrap;">${getPlayers(demo)}</td>*/

        document.getElementById("demos").insertAdjacentHTML("afterbegin", demoHtmls.join(""));

    });

</script>
