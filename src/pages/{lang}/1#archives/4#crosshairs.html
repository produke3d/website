<title lang="en">Crosshairs</title>
<title lang="pt">Miras</title>

<div id="crosshairs" class="grid grid-2-columns grid-gap-32"></div>

<script src="./../../../../lib/build.js/build.js"></script>

<style>
    div.crosshair {
        background-color: #050505;
        border-radius: 10px;
        canvas {
            width: 100%;
            height: 256px;
            border: 1px solid #2C2C2C;
            image-rendering: pixelated;
        }
        button {
            width: 100%;
        }
    }
</style>

<script>

    document.addEventListener("DOMContentLoaded", async () => {

        const crosshairDatabaseUrl = "https://raw.githubusercontent.com/produke3d/website/master/res/databases/crosshairs.json.gz";

        const gzipBytes = await (await fetch(crosshairDatabaseUrl)).arrayBuffer();
        const stream = new Blob([gzipBytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const crosshairDatabase = JSON.parse(await new Response(stream).text());

        const crosshairs = document.getElementById("crosshairs");

        const crosshairElements = [];

        for (const crosshair of crosshairDatabase) {

            crosshairElements.push(`
                <div class="crosshair flex-rows padding-16">
                    <span>${crosshair.Name}.ART</span>
                    <div class="flex-columns">
                        <div class="flex-rows flex-grow">
                            <canvas id="${crosshair.Name.toLowerCase()}-2523"></canvas>
                            <span>#2523</span>    
                        </div>    
                        <div class="flex-rows flex-grow">
                            <canvas id="${crosshair.Name.toLowerCase()}-2527"></canvas>
                            <span>#2527</span>    
                        </div>  
                    </div>
                    <div class="flex-columns flex-grow flex-gap-8">
                        <button class="flex-grow">
                            <img src="{$common}/res/icons/swap.svg" alt="swap" style="width: 16px; vertical-align: middle; margin-top: -4px;">
                            <span>SWAP TILES</span>
                        </button>
                        <button class="flex-grow">
                            <img src="{$common}/res/icons/download.svg" alt="download" style="width: 16px; vertical-align: middle; margin-top: -4px;">
                            <span>DOWNLOAD</span>
                        </button>
                    </div>
                </div>
            `);

        }

        crosshairs.insertAdjacentHTML("afterbegin", crosshairElements.join(""));

        const paletteUrl = "{$common}/res/engine/PALETTE.DAT";
        const paletteBytes = new Uint8Array(await (await fetch(paletteUrl)).arrayBuffer());
        const palette = new Build.Models.Palette(paletteBytes);

        for (const crosshair of crosshairDatabase) {

            const name = crosshair.Name.toLowerCase();
            const crosshairUrl = `https://raw.githubusercontent.com/produke3d/archive/master/crosshairs/${name}.art`;
            const crosshairBytes = new Uint8Array(await (await fetch(crosshairUrl)).arrayBuffer());
            const art = new Build.Models.Art(crosshairBytes);
            const crossTile = art.Tiles[2523-art.Start];
            const circleTile = art.Tiles[2527-art.Start];
            const crossCanvas = document.getElementById(`${name}-2523`);
            const circleCanvas = document.getElementById(`${name}-2527`);

            drawTile(crossTile.pixels, crossCanvas, palette.Colors);
            drawTile(circleTile.pixels, circleCanvas, palette.Colors);

        }

        function drawTile(tile, canvas, palette) {

            const tileWidth = tile.length;
            const tileHeight = tile[0].length;
            const tileCanvas = document.createElement("canvas");
            tileCanvas.width = tileWidth;
            tileCanvas.height = tileHeight;
            const tileContext = tileCanvas.getContext("2d");
            const data = tileContext.createImageData(tileWidth, tileHeight);

            // iterate the Y axis first because the tiles are stored in the opposite coordinate system than the screen memory is stored
            for (let y = 0; y < tileHeight; y++) {
                for (let x = 0; x < tileWidth; x++) {
                    const index = tile[x][y];
                    const color = palette[index];
                    const i = x + y * tileWidth;
                    data.data[i * 4 + 0] = color.r;
                    data.data[i * 4 + 1] = color.g;
                    data.data[i * 4 + 2] = color.b;
                    data.data[i * 4 + 3] = index === 255 ? 0 : 255;
                }
            }

            tileContext.putImageData(data, 0, 0);

            const render = (width, height) => {

                const pixelRatio = window.devicePixelRatio || 1;
                canvas.width = Math.round(width * pixelRatio);
                canvas.height = Math.round(height * pixelRatio);

                const context = canvas.getContext("2d");
                context.scale(pixelRatio, pixelRatio);
                context.imageSmoothingEnabled = false;

                const scale = Math.min(width / tileWidth, height / tileHeight);
                const drawWidth = tileWidth * scale;
                const drawHeight = tileHeight * scale;
                const x = (width - drawWidth) / 2;
                const y = (height - drawHeight) / 2;

                context.drawImage(tileCanvas, x, y, drawWidth, drawHeight);

            };

            const resizeObserver = new ResizeObserver(([entry]) => {
                render(entry.contentRect.width, entry.contentRect.height);
            });
            
            resizeObserver.observe(canvas);

        }

    });

</script>
